on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fork of dkaser/unraid-plugin-release-action with pinned nested actions.
      - uses: andrebrait/unraid-plugin-release-action@bc8f783fa6730140ca95ba65b84a9ec299f8fece
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          composer_dir: "src/usr/local/php/unraid-openfiles/"
