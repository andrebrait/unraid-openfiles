on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fork of dkaser/unraid-plugin-release-action with pinned nested actions.
      - uses: andrebrait/unraid-plugin-release-action@dce598e6bbf68e31392666945ca9cb68f30166db
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          composer_dir: "src/usr/local/php/unraid-openfiles/"
